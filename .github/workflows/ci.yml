name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Unit tests
        run: npm test

      - name: Price-fetcher fixture tests
        run: npm run test:scripts

      - name: Production build (with prerendering)
        run: npm run build

      # Fails if the prerender regressed (route count, CSR shell, per-page
      # canonical) — the failure mode that silently de-indexes the site.
      - name: Verify prerendered output
        run: npm run verify:prerender

      # Structured data is invisible in the browser but a fast route to a
      # Google manual action. Guards what actually shipped, not the generator.
      - name: Validate JSON-LD
        run: node scripts/verify-jsonld.mjs

      # Lighthouse thresholds against the prerendered dist — perf >= 85,
      # SEO 100, a11y >= 95. See lighthouserc.json.
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
