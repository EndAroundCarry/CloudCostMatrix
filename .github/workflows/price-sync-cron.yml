name: Sync Cloud Pricing & Deploy (Firebase Hosting)

on:
  schedule:
    # Runs twice daily at 04:00 and 16:00 UTC (100% Free inside GitHub Actions allowance)
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [main]
    # ALSO sync on every push to main, so a merged change triggers a refresh
    # without waiting for the next schedule.
    #
    # No feedback loop: the bot commits with the default GITHUB_TOKEN, and
    # GitHub does not start new workflow runs for GITHUB_TOKEN pushes. The
    # paths-ignore is belt-and-braces — a commit that only touches the cache
    # file (the bot's own, or a merged-in refresh) never kicks off a new sync.
    paths-ignore:
      - 'src/app/core/engine/catalog/live-pricing-cache.json'

permissions:
  contents: write

# Serialize runs: two overlapping syncs would race each other's `git push` to
# the same branch and one would fail. Queue rather than cancel, so every run
# still lands its refreshed catalog.
concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  sync-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the rebase below can reconcile a concurrent push to
          # main that landed while the sync was running.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run cloud pricing scrapers
        env:
          # Repo secrets. Without GCP/IBM the respective fetcher throws by
          # design and that provider stays on the seeded benchmark. Vultr is
          # different: without VULTR_API_KEY its compute still syncs live from
          # the open plans endpoint, and only the managed-database section
          # stays seeded (see scripts/fetchers/vultr.mjs).
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
          IBM_CLOUD_API_KEY: ${{ secrets.IBM_CLOUD_API_KEY }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: node scripts/sync-prices.mjs

      # Every sync rewrites meta.lastSyncedAt / meta.sources, so the file always
      # differs and a plain `git diff` can't tell a real price move from a
      # timestamp bump. Compare the provider CATALOGS themselves and expose the
      # answer to the deploy steps below. Must run BEFORE the commit step, so
      # HEAD still holds the pre-sync catalog.
      - name: Detect price movement
        id: prices
        run: |
          git show HEAD:src/app/core/engine/catalog/live-pricing-cache.json > "$RUNNER_TEMP/prev-cache.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/prev-cache.json"
          node scripts/cache-content-diff.mjs \
            "$RUNNER_TEMP/prev-cache.json" \
            src/app/core/engine/catalog/live-pricing-cache.json \
            >> "$GITHUB_OUTPUT"

      # Without this step the freshly-written live-pricing-cache.json only ever
      # exists inside this ephemeral runner — every prior run of this workflow
      # has quietly discarded its own output. The app bundles the *committed*
      # JSON (pricing-catalog.resolver.ts imports it directly), so a sync that
      # never lands in the repo is a sync that never reaches production.
      - name: Commit refreshed pricing catalog
        run: |
          git config user.name 'ccm-price-bot'
          git config user.email 'ccm-price-bot@users.noreply.github.com'
          git add src/app/core/engine/catalog/live-pricing-cache.json
          # The sync always rewrites meta.lastSyncedAt, so this normally commits;
          # `||` (not `&&`) keeps a no-change run from failing the step.
          git diff --staged --quiet || git commit -m "chore(pricing): sync $(date -u +%Y-%m-%dT%H:%MZ)"
          # A push to main may have landed while we were syncing — replay our
          # commit on top rather than being rejected as non-fast-forward.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # ── Deploy ──────────────────────────────────────────────────────────
      # The app bundles the committed catalog at BUILD time
      # (pricing-catalog.resolver.ts imports the JSON directly), so the build
      # must happen AFTER the sync above has written it.
      #
      # Guarded to main so a dispatch from a feature branch can never ship to
      # production. A PUSH run always deploys (you merged something); a
      # SCHEDULED run deploys only when a provider's numbers actually moved, so
      # the twice-daily timestamp-only sync no longer rebuilds and redeploys the
      # whole site for nothing.
      - name: Build production bundle
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.prices.outputs.changed == 'true') }}
        run: npm run build

      # Gate the deploy on what actually shipped. These scripts fail loudly on
      # the failures that are invisible in a browser but expensive in search:
      # empty prerendered routes, missing/duplicate titles, a canonical pointing
      # at another page, malformed or policy-violating structured data, and
      # sitemap entries that do not agree with the deployed HTML.
      - name: Verify prerender, structured data and SEO tags
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.prices.outputs.changed == 'true') }}
        run: npm run verify:all

      - name: Deploy to Firebase Hosting
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.prices.outputs.changed == 'true') }}
        env:
          # Repo secret from `firebase login:ci`. firebase-tools reads it from
          # the environment, so the token never appears on the command line or
          # in the step's log.
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@15 deploy --only hosting

      # Search engines that accept IndexNow (Bing, Yandex, Seznam, Naver) get told
      # about the new URLs instead of waiting for the next crawl. Runs after the
      # deploy, because the key file it proves ownership with has to be live
      # already. Non-fatal by design: a rejected ping must not fail a deploy that
      # already succeeded.
      - name: Submit sitemap to IndexNow
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || steps.prices.outputs.changed == 'true') }}
        continue-on-error: true
        run: node scripts/ping-indexnow.mjs

      # Local equivalent, if you ever need to ship from your machine:
      #   npm run build && firebase deploy --only hosting
