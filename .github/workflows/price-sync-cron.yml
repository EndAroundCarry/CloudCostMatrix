name: Sync Cloud Pricing (Free Firebase Spark Tier)

on:
  schedule:
    # Runs twice daily at 04:00 and 16:00 UTC (100% Free inside GitHub Actions allowance)
    - cron: '0 4,16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

# Serialize runs: two overlapping syncs would race each other's `git push` to
# the same branch and one would fail. Queue rather than cancel, so every run
# still lands its refreshed catalog.
concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  sync-pricing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install sync dependencies
        run: npm ci || npm install

      - name: Run cloud pricing scrapers
        run: node scripts/sync-prices.mjs

      # Without this step the freshly-written live-pricing-cache.json only ever
      # exists inside this ephemeral runner — every prior run of this workflow
      # has quietly discarded its own output. The app bundles the *committed*
      # JSON (pricing-catalog.resolver.ts imports it directly), so a sync that
      # never lands in the repo is a sync that never reaches production.
      - name: Commit refreshed pricing catalog
        run: |
          git config user.name 'ccm-price-bot'
          git config user.email 'ccm-price-bot@users.noreply.github.com'
          git add src/app/core/engine/catalog/live-pricing-cache.json
          git diff --staged --quiet || git commit -m "chore(pricing): sync $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      # Deployment is intentionally manual: run `npm run build` then
      # `firebase deploy --only hosting` to ship the refreshed catalog.
